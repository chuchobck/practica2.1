services:
  postgres:
    image: postgres:16
    container_name: pg-productos
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productos_db
    ports:
      - '5442:5432'
    volumes:
      - pg-productos-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-productos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/productos_db
      # 'production' aquí activaría SSL (solo lo requiere el Postgres administrado de Render, Paso 12)
      NODE_ENV: docker
      PORT: 3000
    ports:
      - '3001:3000'

volumes:
  pg-productos-data:
